  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/aws/lambda/${ApiFunction}', RetentionInDays: 30, KmsKeyId: !GetAtt DataKey.Arn, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ApiLogGroup }, { Key: Owner, Value: !Ref ResourceOwner }] }

