  EdgeIpv4Set:
    Type: AWS::WAFv2::IPSet
    Condition: IsStaging
    Properties: { Name: !Sub 'webwatch-${Stage}-edge-ipv4', Scope: CLOUDFRONT, IPAddressVersion: IPV4, Addresses: !Ref StagingIpv4Addresses, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: EdgeIpv4Set }, { Key: Owner, Value: !Ref ResourceOwner }] }
  EdgeIpv6Set:
    Type: AWS::WAFv2::IPSet
    Condition: IsStaging
    Properties: { Name: !Sub 'webwatch-${Stage}-edge-ipv6', Scope: CLOUDFRONT, IPAddressVersion: IPV6, Addresses: !Ref StagingIpv6Addresses, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: EdgeIpv6Set }, { Key: Owner, Value: !Ref ResourceOwner }] }
  RegionalIpv4Set:
    Type: AWS::WAFv2::IPSet
    Condition: IsStaging
    Properties: { Name: !Sub 'webwatch-${Stage}-regional-ipv4', Scope: REGIONAL, IPAddressVersion: IPV4, Addresses: !Ref StagingIpv4Addresses, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: RegionalIpv4Set }, { Key: Owner, Value: !Ref ResourceOwner }] }
  RegionalIpv6Set:
    Type: AWS::WAFv2::IPSet
    Condition: IsStaging
    Properties: { Name: !Sub 'webwatch-${Stage}-regional-ipv6', Scope: REGIONAL, IPAddressVersion: IPV6, Addresses: !Ref StagingIpv6Addresses, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: RegionalIpv6Set }, { Key: Owner, Value: !Ref ResourceOwner }] }
  EdgeWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: IsStaging
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: EdgeWebAcl }, { Key: Owner, Value: !Ref ResourceOwner }]
      Name: !Sub webwatch-${Stage}-edge-allowlist
      Scope: CLOUDFRONT
      DefaultAction: { Block: {} }
      VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: !Sub 'webwatch-${Stage}-edge', SampledRequestsEnabled: true }
      Rules:
        - Name: AllowDeclaredAddresses
          Priority: 0
          Action: { Allow: {} }
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: AllowDeclaredAddresses, SampledRequestsEnabled: true }
          Statement: !If
            - HasBothIpFamilies
            - OrStatement:
                Statements:
                  - IPSetReferenceStatement: { Arn: !GetAtt EdgeIpv4Set.Arn }
                  - IPSetReferenceStatement: { Arn: !GetAtt EdgeIpv6Set.Arn }
            - !If
              - HasIpv4
              - IPSetReferenceStatement: { Arn: !GetAtt EdgeIpv4Set.Arn }
              - IPSetReferenceStatement: { Arn: !GetAtt EdgeIpv6Set.Arn }
        # Header compatibility is a staging perimeter exception, not proof of
        # OpenAI identity. Cognito and application authorization still apply.
        - !If
          - EnableStagingChatGptAccess
          - Name: AllowChatGptUserAgent
            Priority: 1
            Action: { Allow: {} }
            VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: AllowChatGptUserAgent, SampledRequestsEnabled: true }
            Statement:
              RegexMatchStatement:
                RegexString: '(^|[ (;])chatgpt(-user|-agent)?/[0-9]'
                FieldToMatch: { SingleHeader: { Name: user-agent } }
                TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
          - !Ref 'AWS::NoValue'
        - !If
          - EnableStagingChatGptAccess
          - Name: AllowChatGptBrowserHeaders
            Priority: 2
            Action: { Allow: {} }
            VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: AllowChatGptBrowserHeaders, SampledRequestsEnabled: true }
            Statement:
              AndStatement:
                Statements:
                  - RegexMatchStatement:
                      RegexString: '^"https://chatgpt[.]com(/|/[.]well-known/http-message-signatures-directory/?)?"$'
                      FieldToMatch: { SingleHeader: { Name: signature-agent } }
                      TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                  - RegexMatchStatement:
                      RegexString: ';[ \t]*tag="web-bot-auth"([ \t;,]|$)'
                      FieldToMatch: { SingleHeader: { Name: signature-input } }
                      TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                  - RegexMatchStatement:
                      RegexString: '(^|,[ \t]*)[a-z][a-z0-9_.*-]*[ \t]*=[ \t]*:[a-zA-Z0-9+/]+={0,2}:([ \t]*(,|$))'
                      FieldToMatch: { SingleHeader: { Name: signature } }
                      TextTransformations: [{ Priority: 0, Type: NONE }]
          - !Ref 'AWS::NoValue'
  RegionalWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: IsStaging
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: RegionalWebAcl }, { Key: Owner, Value: !Ref ResourceOwner }]
      Name: !Sub webwatch-${Stage}-cognito-allowlist
      Scope: REGIONAL
      DefaultAction: { Block: {} }
      VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: !Sub 'webwatch-${Stage}-cognito', SampledRequestsEnabled: true }
      Rules:
        - Name: AllowDeclaredAddresses
          Priority: 0
          Action: { Allow: {} }
          VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: AllowDeclaredAddresses, SampledRequestsEnabled: true }
          Statement: !If
            - HasBothIpFamilies
            - OrStatement:
                Statements:
                  - IPSetReferenceStatement: { Arn: !GetAtt RegionalIpv4Set.Arn }
                  - IPSetReferenceStatement: { Arn: !GetAtt RegionalIpv6Set.Arn }
            - !If
              - HasIpv4
              - IPSetReferenceStatement: { Arn: !GetAtt RegionalIpv4Set.Arn }
              - IPSetReferenceStatement: { Arn: !GetAtt RegionalIpv6Set.Arn }
        # Header compatibility is a staging perimeter exception, not proof of
        # OpenAI identity. Cognito and application authorization still apply.
        - !If
          - EnableStagingChatGptAccess
          - Name: AllowChatGptUserAgent
            Priority: 1
            Action: { Allow: {} }
            VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: AllowChatGptUserAgent, SampledRequestsEnabled: true }
            Statement:
              RegexMatchStatement:
                RegexString: '(^|[ (;])chatgpt(-user|-agent)?/[0-9]'
                FieldToMatch: { SingleHeader: { Name: user-agent } }
                TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
          - !Ref 'AWS::NoValue'
        - !If
          - EnableStagingChatGptAccess
          - Name: AllowChatGptBrowserHeaders
            Priority: 2
            Action: { Allow: {} }
            VisibilityConfig: { CloudWatchMetricsEnabled: true, MetricName: AllowChatGptBrowserHeaders, SampledRequestsEnabled: true }
            Statement:
              AndStatement:
                Statements:
                  - RegexMatchStatement:
                      RegexString: '^"https://chatgpt[.]com(/|/[.]well-known/http-message-signatures-directory/?)?"$'
                      FieldToMatch: { SingleHeader: { Name: signature-agent } }
                      TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                  - RegexMatchStatement:
                      RegexString: ';[ \t]*tag="web-bot-auth"([ \t;,]|$)'
                      FieldToMatch: { SingleHeader: { Name: signature-input } }
                      TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                  - RegexMatchStatement:
                      RegexString: '(^|,[ \t]*)[a-z][a-z0-9_.*-]*[ \t]*=[ \t]*:[a-zA-Z0-9+/]+={0,2}:([ \t]*(,|$))'
                      FieldToMatch: { SingleHeader: { Name: signature } }
                      TextTransformations: [{ Priority: 0, Type: NONE }]
          - !Ref 'AWS::NoValue'
  CustomerCognitoWafAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: IsStaging
    Properties: { ResourceArn: !GetAtt CustomerUserPool.Arn, WebACLArn: !GetAtt RegionalWebAcl.Arn }
  StewardCognitoWafAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: IsStaging
    Properties: { ResourceArn: !GetAtt StewardUserPool.Arn, WebACLArn: !GetAtt RegionalWebAcl.Arn }

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ApiRole }, { Key: Owner, Value: !Ref ResourceOwner }]
      RoleName: !Sub webwatch-${Stage}-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:ConditionCheckItem
                Resource: !GetAtt CoreTable.Arn
              - Effect: Allow
                Action: [dynamodb:BatchGetItem, dynamodb:BatchWriteItem, dynamodb:DeleteItem, dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:Scan, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt CoreTable.Arn
                  - !Sub '${CoreTable.Arn}/index/*'
                  - !GetAtt IdempotencyTable.Arn
                  - !GetAtt ClosedAccountsTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: !Sub '${SnapshotBucket.Arn}/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::webwatch-${Stage}-${AWS::AccountId}-*-captures/*'
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource:
                  - !GetAtt SnapshotBucket.Arn
                  - !Sub 'arn:${AWS::Partition}:s3:::webwatch-${Stage}-${AWS::AccountId}-*-captures'
              - Effect: Allow
                Action: [sqs:SendMessage]
                Resource: [!GetAtt CheckQueue.Arn, !GetAtt BillingQueue.Arn, !GetAtt ReportQueue.Arn]
              - Effect: Allow
                Action: [cognito-idp:AdminCreateUser]
                Resource: !GetAtt CustomerUserPool.Arn
              - Effect: Allow
                Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminDisableUser, cognito-idp:AdminEnableUser, cognito-idp:AdminDeleteUser]
                Resource: !GetAtt StewardUserPool.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: !GetAtt StewardAuditTable.Arn
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource:
                  - !Ref StripeSecret
                  - !If [EnableTwilio, !Ref TwilioSecret, !Ref 'AWS::NoValue']
                  - !Ref ResponseSecret
                  - !Ref OriginVerifySecret
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: '*'
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/webwatch-${Stage}-api:*'
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: WorkerRole }, { Key: Owner, Value: !Ref ResourceOwner }]
      RoleName: !Sub webwatch-${Stage}-worker
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [cognito-idp:ListUsers, cognito-idp:AdminGetUser, cognito-idp:AdminDisableUser, cognito-idp:AdminUserGlobalSignOut, cognito-idp:AdminDeleteUser]
                Resource: !GetAtt CustomerUserPool.Arn
              - Effect: Allow
                Action: dynamodb:ConditionCheckItem
                Resource: !GetAtt CoreTable.Arn
              - Effect: Allow
                Action: [dynamodb:BatchGetItem, dynamodb:BatchWriteItem, dynamodb:DeleteItem, dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:Scan, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt CoreTable.Arn
                  - !Sub '${CoreTable.Arn}/index/*'
                  - !GetAtt IdempotencyTable.Arn
                  - !GetAtt ClosedAccountsTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: !Sub '${SnapshotBucket.Arn}/*'
              - Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions]
                Resource:
                  - !GetAtt SnapshotBucket.Arn
                  - !Sub 'arn:${AWS::Partition}:s3:::webwatch-${Stage}-${AWS::AccountId}-*-captures'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::webwatch-${Stage}-${AWS::AccountId}-*-captures/*'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: [!GetAtt CheckQueue.Arn, !GetAtt BillingQueue.Arn, !GetAtt CaptureResultQueue.Arn]
              - Effect: Allow
                Action: [sqs:GetQueueUrl, sqs:GetQueueAttributes, sqs:SendMessage]
                Resource:
                  - !GetAtt CaptureQueue.Arn
                  - !Sub 'arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:webwatch-${Stage}-capture-jobs'
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource:
                  - !GetAtt CaptureFunction.Arn
                  - !Sub 'arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:webwatch-${Stage}-regional-capture'
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource:
                  - !Ref StripeSecret
                  - !If [EnableTwilio, !Ref TwilioSecret, !Ref 'AWS::NoValue']
                  - !Ref ResponseSecret
              - Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: '*'
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/webwatch-${Stage}-worker:*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/webwatch-${Stage}-billing:*'
  ReportRole:
    Type: AWS::IAM::Role
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ReportRole }, { Key: Owner, Value: !Ref ResourceOwner }]
      RoleName: !Sub webwatch-${Stage}-report
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: GenerateReports
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:ConditionCheckItem
                Resource: !GetAtt CoreTable.Arn
              - Effect: Allow
                Action: [dynamodb:BatchGetItem, dynamodb:GetItem, dynamodb:Query, dynamodb:Scan]
                Resource:
                  - !GetAtt CoreTable.Arn
                  - !Sub '${CoreTable.Arn}/index/*'
                  - !GetAtt IdempotencyTable.Arn
                  - !GetAtt ClosedAccountsTable.Arn
              - Effect: Allow
                Action: [dynamodb:BatchWriteItem, dynamodb:DeleteItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt CoreTable.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SnapshotBucket.Arn}/reports/*'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt ReportQueue.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/webwatch-${Stage}-report:*'
  DispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: DispatcherRole }, { Key: Owner, Value: !Ref ResourceOwner }]
      RoleName: !Sub webwatch-${Stage}-dispatcher
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: Dispatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query]
                Resource:
                  - !GetAtt CoreTable.Arn
                  - !Sub '${CoreTable.Arn}/index/*'
                  - !GetAtt IdempotencyTable.Arn
                  - !GetAtt ClosedAccountsTable.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt IdempotencyTable.Arn
                Condition: { 'ForAllValues:StringLike': { 'dynamodb:LeadingKeys': ['DISPATCH#*'] } }
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: [!GetAtt CheckQueue.Arn, !GetAtt BillingQueue.Arn]
              - Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource: !GetAtt CheckQueue.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/webwatch-${Stage}-dispatcher:*'
  CaptureRole:
    Type: AWS::IAM::Role
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureRole }, { Key: Owner, Value: !Ref ResourceOwner }]
      RoleName: !Sub webwatch-${Stage}-capture
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: CaptureArtifactsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # S3 reports a missing run-result/capture-history key as 403
              # without ListBucket. The worker needs 404 to create its first
              # result or content-addressed evidence instead of retrying it.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SnapshotBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource:
                  - !Sub '${SnapshotBucket.Arn}/capture-history/*'
                  - !Sub '${SnapshotBucket.Arn}/run-results/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${SnapshotBucket.Arn}/baselines/*'
                  - !Sub '${SnapshotBucket.Arn}/history/*'
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt CaptureQueue.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CaptureResultQueue.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 's3.${AWS::Region}.amazonaws.com'
                    'kms:CallerAccount': !Ref 'AWS::AccountId'
                  StringLike:
                    'kms:EncryptionContext:aws:s3:arn': [!GetAtt SnapshotBucket.Arn, !Sub '${SnapshotBucket.Arn}/*']
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/webwatch-${Stage}-capture:*'
  InboundEmailRole:
    Type: AWS::IAM::Role
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: InboundEmailRole }, { Key: Owner, Value: !Ref ResourceOwner }]
      RoleName: !Sub webwatch-${Stage}-inbound-email
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: ProcessReplies
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:ConditionCheckItem
                Resource: !GetAtt CoreTable.Arn
              - Effect: Allow
                Action: [dynamodb:BatchGetItem, dynamodb:BatchWriteItem, dynamodb:DeleteItem, dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:Scan, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt CoreTable.Arn
                  - !Sub '${CoreTable.Arn}/index/*'
                  - !GetAtt IdempotencyTable.Arn
                  - !GetAtt ClosedAccountsTable.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${InboundMailBucket.Arn}/raw/*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SnapshotBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SnapshotBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::webwatch-${Stage}-${AWS::AccountId}-*-captures/*'
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource: !Ref ResponseSecret
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/webwatch-${Stage}-inbound-email:*'

  CaptureFunction:
    Type: AWS::Lambda::Function
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureFunction }, { Key: Owner, Value: !Ref ResourceOwner }]
      FunctionName: !Sub webwatch-${Stage}-capture
      PackageType: Image
      Architectures: [x86_64]
      Role: !GetAtt CaptureRole.Arn
      MemorySize: 2048
      EphemeralStorage: { Size: 2048 }
      Timeout: 180
      ReservedConcurrentExecutions: !Ref ReservedCaptureConcurrency
      Code: { ImageUri: !Ref WorkerImageUri }
      ImageConfig: { Command: [src/aws/regional-capture-worker.handler] }
      Environment:
        Variables:
          APP_ENV: !Ref Stage
          CAPTURE_QUEUE_URL: !Ref CaptureQueue
          CAPTURE_BUCKET_NAME: !Ref SnapshotBucket
          SNAPSHOT_BUCKET_NAME: !Ref SnapshotBucket
          LEGACY_SNAPSHOT_BUCKET_NAME: !Ref SnapshotBucket
          LEGACY_SNAPSHOT_BUCKET_REGION: !Ref 'AWS::Region'
          SNAPSHOT_BUCKET_REGION: !Ref 'AWS::Region'
          CAPTURE_RESULT_QUEUE_URL: !Ref CaptureResultQueue
          CAPTURE_RESULT_QUEUE_REGION: !Ref 'AWS::Region'
          CAPTURE_WIDTH: 1440
          CAPTURE_HEIGHT: 900
          CAPTURE_TIMEOUT_MS: 150000
          MAX_PAGE_BYTES: 10000000
          ALLOWED_PRIVATE_TARGETS: 'false'
          LOG_LEVEL: info
          DEBUG: !If [IsStaging, 'pw:browser', !Ref 'AWS::NoValue']
  CaptureLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/aws/lambda/${CaptureFunction}', RetentionInDays: 30, KmsKeyId: !GetAtt DataKey.Arn, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureLogGroup }, { Key: Owner, Value: !Ref ResourceOwner }] }

