      MessageRetentionPeriod: 1209600
  CaptureResultQueue:
    Type: AWS::SQS::Queue
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureResultQueue }, { Key: Owner, Value: !Ref ResourceOwner }]
      QueueName: !Sub webwatch-${Stage}-capture-results
      SqsManagedSseEnabled: true
      VisibilityTimeout: 3660
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy: { deadLetterTargetArn: !GetAtt CaptureResultDeadLetterQueue.Arn, maxReceiveCount: 5 }
  BillingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties: { SqsManagedSseEnabled: true, MessageRetentionPeriod: 1209600, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: BillingDeadLetterQueue }, { Key: Owner, Value: !Ref ResourceOwner }] }
  BillingQueue:
    Type: AWS::SQS::Queue
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: BillingQueue }, { Key: Owner, Value: !Ref ResourceOwner }]
      SqsManagedSseEnabled: true
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
