AWSTemplateFormatVersion: '2010-09-09'
Description: 'CLOVERSIGHT serverless SaaS platform in us-east-1: static portals, Cognito managed login, monitoring queues, isolated browser capture, Stripe, SES replies, Twilio webhooks, and privacy operations.'

Parameters:
  Stage:
    Type: String
    AllowedValues: [staging, beta, prod]
    Default: staging
  BaseDomain:
    Type: String
    Default: cloversight.app
  StageBaseDomain:
    Type: String
  PublicDomainName:
    Type: String
  CustomerDomainName:
    Type: String
  StewardDomainName:
    Type: String
  ReplyDomainName:
    Type: String
  HostedZoneId:
    Type: String
    Description: Route 53 public hosted-zone ID for BaseDomain.
  CloudFrontCertificateArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 covering the stage hostnames.
  ArtifactBucketName:
    Type: String
    Description: Existing private deployment-artifact bucket from the bootstrap stack.
  RuntimeArtifactKey:
    Type: String
    Description: S3 key for the production Node.js Lambda ZIP.
  WorkerImageUri:
    Type: String
    Description: Immutable ECR image URI including sha256 digest for browser capture.
  AvailableCheckRegions:
    Type: CommaDelimitedList
    Default: us-east-1
    Description: AWS regions with an installed CLOVERSIGHT regional capture stack.
  CustomerCognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9-]{1,63}$'
  CustomerCognitoDomainMode:
    Type: String
    AllowedValues: [prefix, none, custom, custom-with-prefix]
    Description: Use custom for a new production pool or custom-with-prefix to add the branded host to an installed prefix pool.
  CustomerCognitoCustomDomain:
    Type: String
  CustomerCognitoCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN in us-east-1 covering CustomerCognitoCustomDomain; required in custom mode.
  StewardCognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9-]{1,63}$'
  CustomerMfa:
    Type: String
    AllowedValues: ['OFF', 'OPTIONAL', 'ON']
    Default: 'OFF'
  StewardMfa:
    Type: String
    AllowedValues: ['OFF', 'OPTIONAL', 'ON']
    Default: 'OFF'
  EnableStagingIpv4:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  EnableStagingIpv6:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableStagingChatGptBrowser:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Staging-only any-IP exception for ChatGPT user agents and browser signature-header patterns. Headers are spoofable; this does not authenticate OpenAI or an application user.
  StagingIpv4Addresses:
    Type: CommaDelimitedList
    Default: 192.0.2.1/32
    Description: Initial staging IPv4 CIDRs. Deployment scripts reject documentation ranges.
  StagingIpv6Addresses:
    Type: CommaDelimitedList
    Default: 2001:0db8:0000:0000:0000:0000:0000:0001/128
    Description: Initial staging IPv6 CIDRs. Used only when EnableStagingIpv6=true.
  CognitoEmailDelivery:
    Type: String
    AllowedValues: [cognito, ses]
    Default: cognito
    Description: Select ses after verifying the stage identity. The default preserves existing installations during a CI template update.
  SesFromAddress:
    Type: String
  SesReceiptRuleSetName:
    Type: String
    Default: webwatch-shared-inbound
    Description: Shared regional SES receipt-rule set owned by the bootstrap stack.
  OriginVerifyRevision:
    Type: String
    Default: '1'
    AllowedPattern: '^[A-Za-z0-9._-]{1,64}$'
    Description: Bump after rotating the CloudFront origin verification secret so CloudFormation re-resolves the dynamic secret reference.
  TechnicalAlertsEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  TechnicalAlertEmail:
    Type: String
    Default: ''
  OpsAlertEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$'
    Description: Independent SNS operational recipient. Requires email confirmation. TechnicalAlertEmail is a non-production compatibility fallback.
  BudgetAlertEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$'
    Description: Direct AWS Budgets email fallback, independent of the application SES sender.
  EnableScopedBudget:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Create an additional budget for activated Application=WebWatch AND Stage cost tags. The whole-account budget is always retained.
  ScopedMonthlyBudgetUsd:
    Type: Number
    Default: 25
    MinValue: 1
  ResourceOwner:
    Type: String
    Default: CLOVERSIGHT
    AllowedPattern: '^[A-Za-z0-9._@+-]{1,128}$'
  StaffActionEmail:
    Type: String
    Default: ''
  StewardOwnerSub:
    Type: String
    Default: ''
    AllowedPattern: '^[A-Za-z0-9-]{0,64}$'
    Description: Immutable Cognito sub of the platform owner in this stage's steward pool; no staff API access until configured.
  SnapshotRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
  AccountClosureGraceDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    MinValue: 1
  ReservedCheckConcurrency:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 25
  WorkerReservedConcurrency:
    Type: Number
    Default: 4
    MinValue: 4
    MaxValue: 30
  ReservedCaptureConcurrency:
    Type: Number
    Default: 64
    MinValue: 2
    MaxValue: 500
    Description: On-demand browser concurrency ceiling. No provisioned/warm capacity.
  DispatchBatchSize:
    Type: Number
    Default: 500
    MinValue: 1
    MaxValue: 1000
  CaptureQueueMaxOutstanding:
    Type: Number
    Default: 256
    MinValue: 1
    MaxValue: 1000
    Description: Soft per-region capture admission cap; approximate queue count, not a hard shared permit.
  CaptureQueueHealthCacheSeconds:
    Type: Number
    Default: 10
    MinValue: 0
    MaxValue: 60
  CaptureQueueDeferralSeconds:
    Type: Number
    Default: 60
    MinValue: 15
    MaxValue: 900
  CheckQueueMaxOutstanding:
    Type: Number
    Default: 500
    MinValue: 1
    MaxValue: 1000
  EnableLookupIndex:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Deployment-phase control; existing tables add this GSI before IdentityIndex.
  EnableIdentityIndex:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Deployment-phase control; enabled after LookupIndex is active on an existing table.
  StripeRequestThreeDSecure:
    Type: String
    AllowedValues: [automatic, any]
    Default: automatic
  StripePaymentOrigins:
    Type: String
    Default: ''
    MaxLength: 512
    AllowedPattern: '^(?:https://[^/\s,@?#]+(?:,https://[^/\s,@?#]+)*|)$'
    Description: Additional reviewed exact HTTPS Stripe payment origins; built-in Stripe origins remain allowed.
  TwilioEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Enables SMS permissions, webhook routes, and runtime bindings only when a complete Twilio configuration is supplied.

Rules:
  TechnicalAlertsNeedRecipient:
    RuleCondition: !Equals [!Ref TechnicalAlertsEnabled, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref TechnicalAlertEmail, '']]
        AssertDescription: Set an explicit TechnicalAlertEmail when enabling technical alerts.
  ProductionAdministrativeSafeguards:
    RuleCondition: !Equals [!Ref Stage, prod]
    Assertions:
      - Assert: !Equals [!Ref StewardMfa, 'ON']
        AssertDescription: Production steward Cognito MFA must be ON; the steward client supports Cognito local users only.
      - Assert: !Equals [!Ref TechnicalAlertsEnabled, 'true']
        AssertDescription: Production technical alerts must be enabled.
      - Assert: !Not [!Equals [!Ref TechnicalAlertEmail, '']]
        AssertDescription: Production requires a technical alert email destination.
      - Assert: !Not [!Equals [!Ref OpsAlertEmail, '']]
        AssertDescription: Production requires an independent operational SNS recipient.
      - Assert: !Not [!Equals [!Ref BudgetAlertEmail, '']]
        AssertDescription: Production requires a direct AWS Budgets recipient.
  ScopedBudgetNeedsRecipient:
    RuleCondition: !Equals [!Ref EnableScopedBudget, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref BudgetAlertEmail, '']]
        AssertDescription: The scoped budget requires a direct email recipient.

Conditions:
  IsStaging: !Equals [!Ref Stage, staging]
  EnableStagingChatGptAccess: !And [!Condition IsStaging, !Equals [!Ref EnableStagingChatGptBrowser, 'true']]
  IsProd: !Equals [!Ref Stage, prod]
  HasIpv4: !Equals [!Ref EnableStagingIpv4, 'true']
  HasIpv6: !Equals [!Ref EnableStagingIpv6, 'true']
  HasBothIpFamilies: !And [!Condition HasIpv4, !Condition HasIpv6]
  EnableViewerIpv6: !Or [!Equals [!Ref Stage, beta], !Equals [!Ref Stage, prod], !Equals [!Ref EnableStagingIpv6, 'true']]
  CustomerMfaEnabled: !Not [!Equals [!Ref CustomerMfa, 'OFF']]
  StewardMfaEnabled: !Not [!Equals [!Ref StewardMfa, 'OFF']]
  KeepBothCustomerDomains: !Equals [!Ref CustomerCognitoDomainMode, custom-with-prefix]
  UseCustomOnlyBranding: !Equals [!Ref CustomerCognitoDomainMode, custom]
  UseCustomerPrefixDomain: !Or [!Equals [!Ref CustomerCognitoDomainMode, prefix], !Condition KeepBothCustomerDomains]
  UseCustomerCustomDomain: !Or [!Condition UseCustomOnlyBranding, !Condition KeepBothCustomerDomains]
  UseCognitoSes: !Equals [!Ref CognitoEmailDelivery, ses]
  UseCustomerCustomDomainWithIpv6: !And [!Condition UseCustomerCustomDomain, !Condition EnableViewerIpv6]
  EnableTechnicalAlerts: !Equals [!Ref TechnicalAlertsEnabled, 'true']
  DisableTechnicalAlerts: !Not [!Condition EnableTechnicalAlerts]
  HasOpsAlertEmail: !Not [!Equals [!Ref OpsAlertEmail, '']]
  HasBudgetAlertEmail: !Not [!Equals [!Ref BudgetAlertEmail, '']]
  EnableOpsSubscription: !Or [!Condition HasOpsAlertEmail, !Condition EnableTechnicalAlerts]
  CreateScopedBudget: !Equals [!Ref EnableScopedBudget, 'true']
  EnableTwilio: !Equals [!Ref TwilioEnabled, 'true']
  CreateLookupIndex: !Equals [!Ref EnableLookupIndex, 'true']
  CreateIdentityIndex: !Equals [!Ref EnableIdentityIndex, 'true']

Resources:
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub CLOVERSIGHT ${Stage} application data
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          - Sid: CloudWatchLogsEncryption
            Effect: Allow
            Principal: { Service: !Sub 'logs.${AWS::Region}.${AWS::URLSuffix}' }
            Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          - Sid: CloudWatchNotificationEncryption
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: [kms:Decrypt, kms:GenerateDataKey*, kms:DescribeKey]
            Resource: '*'
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*' }
          - Sid: SesNotificationEncryption
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: [kms:Decrypt, kms:GenerateDataKey*, kms:DescribeKey]
            Resource: '*'
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/webwatch-${Stage}-transactional' }
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: DataKey }, { Key: Owner, Value: !Ref ResourceOwner }]
  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties: { AliasName: !Sub 'alias/webwatch-${Stage}-data', TargetKeyId: !Ref DataKey }

  StewardAuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt DataKey.Arn }
      AttributeDefinitions:
        - { AttributeName: actorId, AttributeType: S }
        - { AttributeName: eventKey, AttributeType: S }
      KeySchema:
        - { AttributeName: actorId, KeyType: HASH }
        - { AttributeName: eventKey, KeyType: RANGE }
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Classification, Value: StewardAudit }, { Key: Component, Value: StewardAuditTable }, { Key: Owner, Value: !Ref ResourceOwner }]

  CoreTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt DataKey.Arn }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - !If [CreateLookupIndex, { AttributeName: GSI2PK, AttributeType: S }, !Ref 'AWS::NoValue']
        - !If [CreateLookupIndex, { AttributeName: GSI2SK, AttributeType: S }, !Ref 'AWS::NoValue']
        - !If [CreateIdentityIndex, { AttributeName: GSI3PK, AttributeType: S }, !Ref 'AWS::NoValue']
        - !If [CreateIdentityIndex, { AttributeName: GSI3SK, AttributeType: S }, !Ref 'AWS::NoValue']
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: ScheduleIndex
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - !If
          - CreateLookupIndex
          - IndexName: LookupIndex
            KeySchema:
              - { AttributeName: GSI2PK, KeyType: HASH }
              - { AttributeName: GSI2SK, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          - !Ref 'AWS::NoValue'
        - !If
          - CreateIdentityIndex
          - IndexName: IdentityIndex
            KeySchema:
              - { AttributeName: GSI3PK, KeyType: HASH }
              - { AttributeName: GSI3SK, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          - !Ref 'AWS::NoValue'
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CoreTable }, { Key: Owner, Value: !Ref ResourceOwner }]
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt DataKey.Arn }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expiresAtEpoch, Enabled: true }
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: IdempotencyTable }, { Key: Owner, Value: !Ref ResourceOwner }]
  ClosedAccountsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt DataKey.Arn }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ClosedAccountsTable }, { Key: Owner, Value: !Ref ResourceOwner }]

  SnapshotBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt DataKey.Arn }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        TransitionDefaultMinimumObjectSize: all_storage_classes_128K
        Rules:
          - Id: ExpireHistoricalSnapshots
            Status: Enabled
            Prefix: history/
            ExpirationInDays: !Ref SnapshotRetentionDays
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
          - Id: ExpireTemporaryCaptureArtifacts
            Status: Enabled
            Prefix: capture-tmp/
            ExpirationInDays: 1
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          - Id: ExpireRegionalRunResults
            Status: Enabled
            Prefix: run-results/
            ExpirationInDays: 2
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          - Id: ExpireCaptureHistory7Days
            Status: Enabled
            Prefix: capture-history/7/
            ExpirationInDays: 9
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          - Id: ExpireCaptureHistory30Days
            Status: Enabled
            Prefix: capture-history/30/
            ExpirationInDays: 32
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          - Id: TierCaptureHistory90Days
            Status: Enabled
            Prefix: capture-history/90/
            Transitions: [{ StorageClass: STANDARD_IA, TransitionInDays: 31 }]
            ExpirationInDays: 92
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          - Id: TierCaptureHistory180Days
            Status: Enabled
            Prefix: capture-history/180/
            Transitions: [{ StorageClass: STANDARD_IA, TransitionInDays: 31 }, { StorageClass: GLACIER_IR, TransitionInDays: 90 }]
            ExpirationInDays: 182
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          - Id: TierCaptureHistory365Days
            Status: Enabled
            Prefix: capture-history/365/
            Transitions: [{ StorageClass: STANDARD_IA, TransitionInDays: 31 }, { StorageClass: GLACIER_IR, TransitionInDays: 90 }]
            ExpirationInDays: 367
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          - Id: TierCaptureHistoryIndefinite
            Status: Enabled
            Prefix: capture-history/indefinite/
            Transitions: [{ StorageClass: STANDARD_IA, TransitionInDays: 31 }, { StorageClass: GLACIER_IR, TransitionInDays: 90 }]
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
          - Id: CleanupReplacedBaselines
            Status: Enabled
            Prefix: baselines/
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
          - Id: ExpireGeneratedReports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 7
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: [!Sub 'https://${PublicDomainName}', !Sub 'https://${CustomerDomainName}']
            AllowedHeaders: ['*']
            MaxAge: 300
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: SnapshotBucket }, { Key: Owner, Value: !Ref ResourceOwner }]
  InboundMailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawInboundMail
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: InboundMailBucket }, { Key: Owner, Value: !Ref ResourceOwner }]
  InboundMailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InboundMailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Sid: DenyInsecureTransport, Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt InboundMailBucket.Arn, !Sub '${InboundMailBucket.Arn}/*'], Condition: { Bool: { 'aws:SecureTransport': 'false', 'aws:PrincipalIsAWSService': 'false' } } }
          - Sid: AllowSesReceiptStorage
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${InboundMailBucket.Arn}/raw/*'
            Condition: { StringEquals: { 'AWS:SourceAccount': !Ref 'AWS::AccountId' } }

  PublicWebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: PublicWebBucket }, { Key: Owner, Value: !Ref ResourceOwner }]
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
  CustomerWebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CustomerWebBucket }, { Key: Owner, Value: !Ref ResourceOwner }]
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
  StewardWebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: StewardWebBucket }, { Key: Owner, Value: !Ref ResourceOwner }]
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }

  StripeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: StripeSecret }, { Key: Owner, Value: !Ref ResourceOwner }]
      Name: !Sub webwatch-${Stage}-stripe
      Description: Stripe secret key, webhook secret, API version, and server-owned Price IDs. Populate with infra/scripts/push-secrets.sh.
      KmsKeyId: !Ref DataKey
      GenerateSecretString:
        SecretStringTemplate: '{"secretKey":"","webhookSecret":"","apiVersion":"","priceIds":{"free":"","essentials":"","professional":"","team":"","business":"","scale":""}}'
        GenerateStringKey: bootstrapNonce
        PasswordLength: 32
        ExcludePunctuation: true
  TwilioSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: TwilioSecret }, { Key: Owner, Value: !Ref ResourceOwner }]
      Name: !Sub webwatch-${Stage}-twilio
      Description: Inert credential container unless TwilioEnabled is true; retained so SMS can be re-enabled safely without a named-secret collision.
      KmsKeyId: !Ref DataKey
      GenerateSecretString:
        SecretStringTemplate: '{"accountSid":"","authToken":"","from":""}'
        GenerateStringKey: bootstrapNonce
        PasswordLength: 32
        ExcludePunctuation: true
  ResponseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ResponseSecret }, { Key: Owner, Value: !Ref ResourceOwner }]
      Name: !Sub webwatch-${Stage}-response-signing
      Description: HMAC secret for signed recipient links and financial calculation envelopes.
      KmsKeyId: !Ref DataKey
      GenerateSecretString: { SecretStringTemplate: '{}', GenerateStringKey: integritySecret, PasswordLength: 64, ExcludePunctuation: true }
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: OriginVerifySecret }, { Key: Owner, Value: !Ref ResourceOwner }]
      Name: !Sub webwatch-${Stage}-cloudfront-origin
      Description: CloudFront-to-API verification value. Rotate only with a coordinated stack update.
      KmsKeyId: !Ref DataKey
      GenerateSecretString: { SecretStringTemplate: '{}', GenerateStringKey: originVerifySecret, PasswordLength: 64, ExcludePunctuation: true }

  CheckDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties: { SqsManagedSseEnabled: true, MessageRetentionPeriod: 1209600, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CheckDeadLetterQueue }, { Key: Owner, Value: !Ref ResourceOwner }] }
  CheckQueue:
    Type: AWS::SQS::Queue
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CheckQueue }, { Key: Owner, Value: !Ref ResourceOwner }]
      SqsManagedSseEnabled: true
      VisibilityTimeout: 3600
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy: { deadLetterTargetArn: !GetAtt CheckDeadLetterQueue.Arn, maxReceiveCount: 5 }
  CaptureDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureDeadLetterQueue }, { Key: Owner, Value: !Ref ResourceOwner }]
      QueueName: !Sub webwatch-${Stage}-capture-jobs-dlq
