  StewardUserPoolId: { Value: !Ref StewardUserPool }
  StewardClientId: { Value: !Ref StewardUserPoolClient }
  StewardCognitoDomain: { Value: !Sub 'https://${StewardCognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com' }
  StripeSecretArn: { Value: !Ref StripeSecret }
  TwilioSecretArn: { Condition: EnableTwilio, Value: !Ref TwilioSecret }
  ResponseSecretArn: { Value: !Ref ResponseSecret }
  OriginVerifySecretArn: { Value: !Ref OriginVerifySecret }
  SesReceiptRuleSetOutput: { Value: !Ref SesReceiptRuleSetName }
  SesReceiptRuleNameOutput: { Value: !Sub 'webwatch-${Stage}-replies' }
  EdgeWebAclArn: { Condition: IsStaging, Value: !GetAtt EdgeWebAcl.Arn }
  RegionalWebAclArn: { Condition: IsStaging, Value: !GetAtt RegionalWebAcl.Arn }
  EdgeIpv4SetId: { Condition: IsStaging, Value: !GetAtt EdgeIpv4Set.Id }
  EdgeIpv6SetId: { Condition: IsStaging, Value: !GetAtt EdgeIpv6Set.Id }
  RegionalIpv4SetId: { Condition: IsStaging, Value: !GetAtt RegionalIpv4Set.Id }
  RegionalIpv6SetId: { Condition: IsStaging, Value: !GetAtt RegionalIpv6Set.Id }
  EdgeIpv4SetName: { Condition: IsStaging, Value: !Sub 'webwatch-${Stage}-edge-ipv4' }
  EdgeIpv6SetName: { Condition: IsStaging, Value: !Sub 'webwatch-${Stage}-edge-ipv6' }
  RegionalIpv4SetName: { Condition: IsStaging, Value: !Sub 'webwatch-${Stage}-regional-ipv4' }
  RegionalIpv6SetName: { Condition: IsStaging, Value: !Sub 'webwatch-${Stage}-regional-ipv6' }
  CheckQueueUrl: { Value: !Ref CheckQueue }
  BillingQueueUrl: { Value: !Ref BillingQueue }
  OpsTopicArn: { Value: !Ref OpsTopic }
  AccountBudgetName: { Value: !Sub 'WebWatch-${Stage}-monthly' }
