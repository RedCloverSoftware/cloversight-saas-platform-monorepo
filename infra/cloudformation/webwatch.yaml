  ReportDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties: { SqsManagedSseEnabled: true, MessageRetentionPeriod: 1209600, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ReportDeadLetterQueue }, { Key: Owner, Value: !Ref ResourceOwner }] }
  ReportQueue:
    Type: AWS::SQS::Queue
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ReportQueue }, { Key: Owner, Value: !Ref ResourceOwner }]
      SqsManagedSseEnabled: true
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy: { deadLetterTargetArn: !GetAtt ReportDeadLetterQueue.Arn, maxReceiveCount: 5 }

  PreTokenRole:
    Type: AWS::IAM::Role
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: PreTokenRole }, { Key: Owner, Value: !Ref ResourceOwner }]
      RoleName: !Sub webwatch-${Stage}-pre-token
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: [logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/webwatch-${Stage}-pre-token-*:*' }
  CustomerPreTokenFunction:
    Type: AWS::Lambda::Function
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CustomerPreTokenFunction }, { Key: Owner, Value: !Ref ResourceOwner }]
      FunctionName: !Sub webwatch-${Stage}-pre-token-customer
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/aws/cognito-pre-token-handler.handler
      Role: !GetAtt PreTokenRole.Arn
      MemorySize: 128
      Timeout: 5
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Ref RuntimeArtifactKey }
      Environment: { Variables: { TOKEN_ROLE: customer } }
  StewardPreTokenFunction:
    Type: AWS::Lambda::Function
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: StewardPreTokenFunction }, { Key: Owner, Value: !Ref ResourceOwner }]
      FunctionName: !Sub webwatch-${Stage}-pre-token-steward
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/aws/cognito-pre-token-handler.handler
      Role: !GetAtt PreTokenRole.Arn
      MemorySize: 128
      Timeout: 5
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Ref RuntimeArtifactKey }
      Environment: { Variables: { TOKEN_ROLE: steward } }
  CustomerPreTokenLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/aws/lambda/${CustomerPreTokenFunction}', RetentionInDays: 30, KmsKeyId: !GetAtt DataKey.Arn, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CustomerPreTokenLogGroup }, { Key: Owner, Value: !Ref ResourceOwner }] }
  StewardPreTokenLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/aws/lambda/${StewardPreTokenFunction}', RetentionInDays: 30, KmsKeyId: !GetAtt DataKey.Arn, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: StewardPreTokenLogGroup }, { Key: Owner, Value: !Ref ResourceOwner }] }

  CustomerUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub webwatch-${Stage}-customers
      UserPoolTier: ESSENTIALS
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      EmailConfiguration: !If
        - UseCognitoSes
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesDomainIdentity}'
          From: !Sub 'Cloversight <no-reply@${StageBaseDomain}>'
        - !Ref 'AWS::NoValue'
      MfaConfiguration: !Ref CustomerMfa
      EnabledMfas: !If
        - CustomerMfaEnabled
        - [SOFTWARE_TOKEN_MFA]
        - !Ref 'AWS::NoValue'
      AccountRecoverySetting: { RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }] }
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      Policies:
        PasswordPolicy: { MinimumLength: 14, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true, TemporaryPasswordValidityDays: 14 }
      LambdaConfig:
        PreTokenGenerationConfig: { LambdaArn: !GetAtt CustomerPreTokenFunction.Arn, LambdaVersion: V2_0 }
      UserAttributeUpdateSettings: { AttributesRequireVerificationBeforeUpdate: [email] }
      UserPoolTags: { Application: WebWatch, Stage: !Ref Stage, Portal: customer, Component: CustomerUserPool, Owner: !Ref ResourceOwner }
  StewardUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub webwatch-${Stage}-stewards
      UserPoolTier: ESSENTIALS
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      EmailConfiguration: !If
        - UseCognitoSes
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesDomainIdentity}'
          From: !Sub 'Cloversight <no-reply@${StageBaseDomain}>'
        - !Ref 'AWS::NoValue'
      MfaConfiguration: !Ref StewardMfa
      EnabledMfas: !If
        - StewardMfaEnabled
        - [SOFTWARE_TOKEN_MFA]
        - !Ref 'AWS::NoValue'
      AccountRecoverySetting: { RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }] }
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      Policies:
        PasswordPolicy: { MinimumLength: 16, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true, TemporaryPasswordValidityDays: 1 }
      LambdaConfig:
        PreTokenGenerationConfig: { LambdaArn: !GetAtt StewardPreTokenFunction.Arn, LambdaVersion: V2_0 }
      UserAttributeUpdateSettings: { AttributesRequireVerificationBeforeUpdate: [email] }
      UserPoolTags: { Application: WebWatch, Stage: !Ref Stage, Portal: steward, Component: StewardUserPool, Owner: !Ref ResourceOwner }
  CustomerPreTokenPermission:
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref CustomerPreTokenFunction, Action: lambda:InvokeFunction, Principal: cognito-idp.amazonaws.com, SourceArn: !GetAtt CustomerUserPool.Arn }
  StewardPreTokenPermission:
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref StewardPreTokenFunction, Action: lambda:InvokeFunction, Principal: cognito-idp.amazonaws.com, SourceArn: !GetAtt StewardUserPool.Arn }
  CustomerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub webwatch-${Stage}-customer-spa
      UserPoolId: !Ref CustomerUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 7
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub 'https://${PublicDomainName}/app/']
      LogoutURLs: [!Sub 'https://${PublicDomainName}/']
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
  StewardUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub webwatch-${Stage}-steward-spa
      UserPoolId: !Ref StewardUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 10
      IdTokenValidity: 10
      RefreshTokenValidity: 1
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub 'https://${StewardDomainName}/']
      LogoutURLs: [!Sub 'https://${StewardDomainName}/']
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
  CustomerUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: UseCustomerPrefixDomain
    Properties: { UserPoolId: !Ref CustomerUserPool, Domain: !Ref CustomerCognitoDomainPrefix, ManagedLoginVersion: 2 }
  CustomerUserPoolCustomDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: UseCustomerCustomDomain
    DependsOn: PublicDnsA
    Properties:
      UserPoolId: !Ref CustomerUserPool
      Domain: !Ref CustomerCognitoCustomDomain
      ManagedLoginVersion: 2
      CustomDomainConfig: { CertificateArn: !Ref CustomerCognitoCertificateArn }
  StewardUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties: { UserPoolId: !Ref StewardUserPool, Domain: !Ref StewardCognitoDomainPrefix, ManagedLoginVersion: 2 }
