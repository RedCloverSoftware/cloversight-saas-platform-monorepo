  CaptureQueue:
    Type: AWS::SQS::Queue
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureQueue }, { Key: Owner, Value: !Ref ResourceOwner }]
      QueueName: !Sub webwatch-${Stage}-capture-jobs
      SqsManagedSseEnabled: true
      VisibilityTimeout: 1200
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy: { deadLetterTargetArn: !GetAtt CaptureDeadLetterQueue.Arn, maxReceiveCount: 5 }
  CaptureResultDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureResultDeadLetterQueue }, { Key: Owner, Value: !Ref ResourceOwner }]
      QueueName: !Sub webwatch-${Stage}-capture-results-dlq
