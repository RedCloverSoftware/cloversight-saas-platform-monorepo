  TwilioStatusWebhookUrl: { Condition: EnableTwilio, Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/webhooks/twilio/status' }
  PublicUrl: { Value: !Sub 'https://${PublicDomainName}' }
  CustomerUrl: { Value: !Sub 'https://${PublicDomainName}/app/' }
  LegacyCustomerUrl: { Value: !Sub 'https://${CustomerDomainName}' }
  StewardUrl: { Value: !Sub 'https://${StewardDomainName}' }
  PublicDistributionId: { Value: !Ref PublicDistribution }
  CustomerDistributionId: { Value: !Ref CustomerDistribution }
  StewardDistributionId: { Value: !Ref StewardDistribution }
  PublicBucket: { Value: !Ref PublicWebBucket }
  CustomerBucket: { Value: !Ref CustomerWebBucket }
  StewardBucket: { Value: !Ref StewardWebBucket }
  SnapshotBucket: { Value: !Ref SnapshotBucket }
  SnapshotBucketRegion: { Value: !Ref 'AWS::Region' }
  DataKeyArn: { Value: !GetAtt DataKey.Arn }
  CaptureFunctionName: { Value: !Ref CaptureFunction }
  CaptureQueueName: { Value: !GetAtt CaptureQueue.QueueName }
  CaptureQueueUrl: { Value: !Ref CaptureQueue }
  CaptureResultQueueUrl: { Value: !Ref CaptureResultQueue }
  CaptureResultQueueArn: { Value: !GetAtt CaptureResultQueue.Arn }
  ReportQueueUrl: { Value: !Ref ReportQueue }
