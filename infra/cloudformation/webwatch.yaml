          CORE_TABLE_NAME: !Ref CoreTable
          IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTable
          CLOSED_ACCOUNTS_TABLE_NAME: !Ref ClosedAccountsTable
          CHECK_QUEUE_URL: !Ref CheckQueue
          BILLING_QUEUE_URL: !Ref BillingQueue
          DISPATCH_BATCH_SIZE: !Ref DispatchBatchSize
          CHECK_QUEUE_MAX_OUTSTANDING: !Ref CheckQueueMaxOutstanding
  DispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/aws/lambda/${DispatcherFunction}', RetentionInDays: 30, KmsKeyId: !GetAtt DataKey.Arn, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: DispatcherLogGroup }, { Key: Owner, Value: !Ref ResourceOwner }] }
  DispatchRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets: [{ Arn: !GetAtt DispatcherFunction.Arn, Id: Dispatcher }]
  DispatchPermission:
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref DispatcherFunction, Action: lambda:InvokeFunction, Principal: events.amazonaws.com, SourceArn: !GetAtt DispatchRule.Arn }

  InboundEmailFunction:
    Type: AWS::Lambda::Function
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: InboundEmailFunction }, { Key: Owner, Value: !Ref ResourceOwner }]
      FunctionName: !Sub webwatch-${Stage}-inbound-email
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/aws/inbound-email-handler.handler
      Role: !GetAtt InboundEmailRole.Arn
      MemorySize: 512
      Timeout: 60
      ReservedConcurrentExecutions: 2
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Ref RuntimeArtifactKey }
      Environment:
        Variables:
          APP_ENV: !Ref Stage
          SES_REGION: !Ref 'AWS::Region'
          LOG_LEVEL: info
          CORE_TABLE_NAME: !Ref CoreTable
          IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTable
          CLOSED_ACCOUNTS_TABLE_NAME: !Ref ClosedAccountsTable
          SNAPSHOT_BUCKET_NAME: !Ref SnapshotBucket
          SNAPSHOT_BUCKET_REGION: !Ref 'AWS::Region'
          AWS_ACCOUNT_ID: !Ref 'AWS::AccountId'
          CAPTURE_QUEUE_NAME: !GetAtt CaptureQueue.QueueName
          CAPTURE_RESULT_QUEUE_URL: !Ref CaptureResultQueue
          CAPTURE_RESULT_QUEUE_REGION: !Ref 'AWS::Region'
          INBOUND_MAIL_BUCKET_NAME: !Ref InboundMailBucket
          INBOUND_MAIL_PREFIX: raw/
          RESPONSE_SECRET_ARN: !Ref ResponseSecret
          BILLING_PROVIDER: disabled
          EMAIL_PROVIDER: disabled
          SMS_PROVIDER: disabled
          SNAPSHOT_RETENTION_DAYS: !Ref SnapshotRetentionDays
          ACCOUNT_CLOSURE_GRACE_DAYS: !Ref AccountClosureGraceDays
  InboundEmailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/aws/lambda/${InboundEmailFunction}', RetentionInDays: 30, KmsKeyId: !GetAtt DataKey.Arn, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: InboundEmailLogGroup }, { Key: Owner, Value: !Ref ResourceOwner }] }

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub webwatch-${Stage}
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000
  CustomerAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: customer-jwt
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${CustomerUserPool}'
        Audience: [!Ref CustomerUserPoolClient]
  StewardAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: steward-jwt
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${StewardUserPool}'
        Audience: [!Ref StewardUserPoolClient]
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/health', AuthorizationType: NONE, Target: !Sub 'integrations/${ApiIntegration}' }
  AssetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/assets', AuthorizationType: NONE, Target: !Sub 'integrations/${ApiIntegration}' }
  StripeWebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /api/webhooks/stripe', AuthorizationType: NONE, Target: !Sub 'integrations/${ApiIntegration}' }
  TwilioInboundRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: EnableTwilio
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /api/webhooks/twilio/inbound', AuthorizationType: NONE, Target: !Sub 'integrations/${ApiIntegration}' }
  TwilioStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: EnableTwilio
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /api/webhooks/twilio/status', AuthorizationType: NONE, Target: !Sub 'integrations/${ApiIntegration}' }
  ResponsePageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /respond/{proxy+}', AuthorizationType: NONE, Target: !Sub 'integrations/${ApiIntegration}' }
  UnsubscribePageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /unsubscribe/{proxy+}', AuthorizationType: NONE, Target: !Sub 'integrations/${ApiIntegration}' }
  AlertResponseRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /api/alerts/respond', AuthorizationType: NONE, Target: !Sub 'integrations/${ApiIntegration}' }
  AlertCodeResponseRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /api/alerts/respond-code', AuthorizationType: NONE, Target: !Sub 'integrations/${ApiIntegration}' }
  CustomerBootstrapRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/customer/bootstrap', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  CustomerSnapshotAssetsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/customer/snapshots/{snapshotId}/assets', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  WatcherCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /api/watchers', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  WatcherProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /api/watchers/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  CheckStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/checks/{jobId}', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  BannedPhraseRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /api/banned-phrases/parse', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  BillingProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /api/billing/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  TransactionProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /api/transactions/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  AccountProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /api/account/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  UserProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /api/user/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  TeamRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/team', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  TeamProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /api/team/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  ActionLogRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/action-log', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  ActionLogProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /api/action-log/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  ReportsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /api/reports', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  ReportsProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /api/reports/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CustomerAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  StewardProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'ANY /api/steward/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref StewardAuthorizer, Target: !Sub 'integrations/${ApiIntegration}' }
  ApiAccessLog:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 30, KmsKeyId: !GetAtt DataKey.Arn, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ApiAccessLog }, { Key: Owner, Value: !Ref ResourceOwner }] }
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    # RouteSettings addresses TeamProxyRoute by its route key, not by !Ref;
    # make CloudFormation create/update the route before applying its throttle.
    DependsOn: TeamProxyRoute
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings: { ThrottlingBurstLimit: 50, ThrottlingRateLimit: 25, DetailedMetricsEnabled: true }
      RouteSettings:
        'ANY /api/team/{proxy+}': { ThrottlingBurstLimit: 5, ThrottlingRateLimit: 2, DetailedMetricsEnabled: true }
      AccessLogSettings:
        DestinationArn:
          Fn::Select:
            - 0
            - Fn::Split: [':*', !GetAtt ApiAccessLog.Arn]
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","latency":"$context.responseLatency","ip":"$context.identity.sourceIp"}'
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref ApiFunction, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*' }

  SesDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref StageBaseDomain
      DkimAttributes: { SigningEnabled: true }
      DkimSigningAttributes: { NextSigningKeyLength: RSA_2048_BIT }
      MailFromAttributes: { MailFromDomain: !Sub 'mail.${StageBaseDomain}', BehaviorOnMxFailure: USE_DEFAULT_VALUE }
  SesDkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !GetAtt SesDomainIdentity.DkimDNSTokenName1, Type: CNAME, TTL: 300, ResourceRecords: [!GetAtt SesDomainIdentity.DkimDNSTokenValue1] }
  SesDkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !GetAtt SesDomainIdentity.DkimDNSTokenName2, Type: CNAME, TTL: 300, ResourceRecords: [!GetAtt SesDomainIdentity.DkimDNSTokenValue2] }
  SesDkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !GetAtt SesDomainIdentity.DkimDNSTokenName3, Type: CNAME, TTL: 300, ResourceRecords: [!GetAtt SesDomainIdentity.DkimDNSTokenValue3] }
  SesMailFromMx:
    Type: AWS::Route53::RecordSet
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Sub 'mail.${StageBaseDomain}', Type: MX, TTL: 300, ResourceRecords: [!Sub '10 feedback-smtp.${AWS::Region}.amazonses.com.'] }
  SesMailFromSpf:
    Type: AWS::Route53::RecordSet
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Sub 'mail.${StageBaseDomain}', Type: TXT, TTL: 300, ResourceRecords: ['"v=spf1 include:amazonses.com ~all"'] }
  SesDmarcRecord:
    Type: AWS::Route53::RecordSet
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Sub '_dmarc.${StageBaseDomain}', Type: TXT, TTL: 300, ResourceRecords: ['"v=DMARC1; p=none; adkim=r; aspf=r"'] }
  ReplyMxRecord:
    Type: AWS::Route53::RecordSet
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Ref ReplyDomainName, Type: MX, TTL: 300, ResourceRecords: [!Sub '10 inbound-smtp.${AWS::Region}.${AWS::URLSuffix}.'] }
  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub webwatch-${Stage}-transactional
      ReputationOptions: { ReputationMetricsEnabled: true }
      SendingOptions: { SendingEnabled: true }
  InboundEmailInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InboundEmailFunction
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref 'AWS::AccountId'
      SourceArn: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${SesReceiptRuleSetName}:receipt-rule/webwatch-${Stage}-replies'
  SesReceiptRule:
    Type: AWS::SES::ReceiptRule
    DependsOn: [InboundMailBucketPolicy, InboundEmailInvokePermission]
    Properties:
      RuleSetName: !Ref SesReceiptRuleSetName
      Rule:
        Name: !Sub webwatch-${Stage}-replies
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Require
        Recipients: [!Ref ReplyDomainName]
        Actions:
          - S3Action: { BucketName: !Ref InboundMailBucket, ObjectKeyPrefix: raw/ }
          - LambdaAction: { FunctionArn: !GetAtt InboundEmailFunction.Arn, InvocationType: Event }

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig: { Name: !Sub 'webwatch-${Stage}-s3-oac', OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4 }
  PublicUrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub webwatch-${Stage}-public-rewrite
      AutoPublish: true
      FunctionConfig: { Comment: Resolve extensionless marketing URLs, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/home' || request.uri === '/home/') return { statusCode: 308, statusDescription: 'Permanent Redirect', headers: { location: { value: '/' }, 'cache-control': { value: 'public, max-age=3600' } } };
          else if (/^\/(pricing|privacy|security|status|support|terms)\/$/.test(request.uri)) request.uri = request.uri.slice(0, -1) + '.html';
          else if (request.uri.endsWith('/')) request.uri += 'index.html';
          else if (request.uri.indexOf('.') === -1) request.uri += '.html';
          return request;
        }
  CustomerSpaRewriteFunction:
    # Serialize operations within this CloudFront API family to reduce control-plane throttling.
    DependsOn: PublicUrlRewriteFunction
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub webwatch-${Stage}-customer-spa-rewrite
      AutoPublish: true
      FunctionConfig: { Comment: Route customer SPA deep links to index.html, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/' || request.uri === '/app' || request.uri.indexOf('/app/') === 0) request.uri = '/index.html';
          return request;
        }
  CustomerLegacyRedirectFunction:
    # Serialize operations within this CloudFront API family to reduce control-plane throttling.
    DependsOn: CustomerSpaRewriteFunction
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub webwatch-${Stage}-customer-legacy-redirect
      AutoPublish: true
      FunctionConfig: { Comment: Redirect the former login subdomain to the canonical same-domain customer app, Runtime: cloudfront-js-2.0 }
      FunctionCode: !Sub |
        function handler(event) {
          var uri = event.request.uri || '/';
          var target = (uri === '/' || uri === '/index.html') ? '/app/' : uri;
          return {
            statusCode: 308,
            statusDescription: 'Permanent Redirect',
            headers: { location: { value: 'https://${PublicDomainName}' + target } }
          };
        }
  StewardSpaRewriteFunction:
    # Serialize operations within this CloudFront API family to reduce control-plane throttling.
    DependsOn: CustomerLegacyRedirectFunction
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub webwatch-${Stage}-steward-spa-rewrite
      AutoPublish: true
      FunctionConfig: { Comment: Route steward console deep links to index.html, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri || '/';
          if (uri === '/' || (uri.indexOf('.') === -1 && uri.indexOf('/static/') !== 0 && uri.indexOf('/steward-static/') !== 0)) request.uri = '/index.html';
          return request;
        }
  PortalResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub webwatch-${Stage}-portal-security
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Preload: true, Override: true }
          XSSProtection: { Protection: true, ModeBlock: true, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; img-src 'self' data: https://*.amazonaws.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.amazoncognito.com https://${CustomerCognitoCustomDomain}; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.amazoncognito.com https://${CustomerCognitoCustomDomain}; object-src 'none'"
        CustomHeadersConfig:
          Items:
            - { Header: Permissions-Policy, Value: 'camera=(), microphone=(), geolocation=(), payment=(self)', Override: true }
            - { Header: Cross-Origin-Opener-Policy, Value: same-origin, Override: true }
  PublicResponseHeadersPolicy:
    # Serialize operations within this CloudFront API family to reduce control-plane throttling.
    DependsOn: PortalResponseHeadersPolicy
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub webwatch-${Stage}-public-security
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Preload: true, Override: true }
          XSSProtection: { Protection: true, ModeBlock: true, Override: true }
          ContentSecurityPolicy: { Override: true, ContentSecurityPolicy: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" }
  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub webwatch-${Stage}-static-cache
        Comment: Cache immutable/static portal assets while honoring origin cache-control.
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: { CookieBehavior: none }
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
  ApiNoCachePolicy:
    # Serialize operations within this CloudFront API family to reduce control-plane throttling.
    DependsOn: StaticCachePolicy
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'webwatch-${Stage}-api-no-cache'
        Comment: API responses are no-store; carry Authorization to API Gateway.
        DefaultTTL: 0
        MaxTTL: 1
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Authorization
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub 'webwatch-${Stage}-api-origin'
        Comment: Portal API headers; Authorization via cache policy; origin secret injected by CloudFront.
        CookiesConfig:
          CookieBehavior: all
        QueryStringsConfig:
          QueryStringBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Accept
            - Accept-Language
            - Content-Type
            - Origin
            - Access-Control-Request-Headers
            - Access-Control-Request-Method
            - If-Match
            - If-None-Match

  PublicDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: PublicDistribution }, { Key: Owner, Value: !Ref ResourceOwner }]
      DistributionConfig:
        Enabled: true
        IPV6Enabled: !If [EnableViewerIpv6, true, false]
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Aliases: [!Ref PublicDomainName]
        WebACLId: !If [IsStaging, !GetAtt EdgeWebAcl.Arn, !Ref 'AWS::NoValue']
        ViewerCertificate: { AcmCertificateArn: !Ref CloudFrontCertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
        Origins:
          - Id: PublicS3
            DomainName: !GetAtt PublicWebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: CustomerS3
            DomainName: !GetAtt CustomerWebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: ApiOrigin
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            OriginCustomHeaders:
              - HeaderName: X-WebWatch-Origin
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginVerifySecret}:SecretString:originVerifySecret}}'
              - HeaderName: X-WebWatch-Origin-Revision
                HeaderValue: !Ref OriginVerifyRevision
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: PublicS3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !Ref StaticCachePolicy
          ResponseHeadersPolicyId: !Ref PublicResponseHeadersPolicy
          FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt PublicUrlRewriteFunction.FunctionARN }]
        CacheBehaviors:
          - PathPattern: /app-static/*
            TargetOriginId: CustomerS3
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref PortalResponseHeadersPolicy
          - PathPattern: /runtime-config.json
            TargetOriginId: CustomerS3
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiNoCachePolicy
            ResponseHeadersPolicyId: !Ref PortalResponseHeadersPolicy
          - PathPattern: /app*
            TargetOriginId: CustomerS3
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref StaticCachePolicy
            ResponseHeadersPolicyId: !Ref PortalResponseHeadersPolicy
            FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt CustomerSpaRewriteFunction.FunctionARN }]
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiNoCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref PortalResponseHeadersPolicy
          - PathPattern: /respond/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiNoCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref PortalResponseHeadersPolicy
          - PathPattern: /unsubscribe/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiNoCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref PortalResponseHeadersPolicy
  CustomerDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CustomerDistribution }, { Key: Owner, Value: !Ref ResourceOwner }]
      DistributionConfig:
        Enabled: true
        IPV6Enabled: !If [EnableViewerIpv6, true, false]
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Aliases: [!Ref CustomerDomainName]
        WebACLId: !If [IsStaging, !GetAtt EdgeWebAcl.Arn, !Ref 'AWS::NoValue']
        ViewerCertificate: { AcmCertificateArn: !Ref CloudFrontCertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
        Origins:
          - Id: CustomerS3
            DomainName: !GetAtt CustomerWebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: CustomerS3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !Ref StaticCachePolicy
          ResponseHeadersPolicyId: !Ref PortalResponseHeadersPolicy
          FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt CustomerLegacyRedirectFunction.FunctionARN }]
  StewardDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: StewardDistribution }, { Key: Owner, Value: !Ref ResourceOwner }]
      DistributionConfig:
        Enabled: true
        IPV6Enabled: !If [EnableViewerIpv6, true, false]
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Aliases: [!Ref StewardDomainName]
        WebACLId: !If [IsStaging, !GetAtt EdgeWebAcl.Arn, !Ref 'AWS::NoValue']
        ViewerCertificate: { AcmCertificateArn: !Ref CloudFrontCertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
        Origins:
          - Id: StewardS3
            DomainName: !GetAtt StewardWebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: ApiOrigin
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            OriginCustomHeaders:
              - HeaderName: X-WebWatch-Origin
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginVerifySecret}:SecretString:originVerifySecret}}'
              - HeaderName: X-WebWatch-Origin-Revision
                HeaderValue: !Ref OriginVerifyRevision
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: StewardS3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !Ref StaticCachePolicy
          ResponseHeadersPolicyId: !Ref PortalResponseHeadersPolicy
          FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt StewardSpaRewriteFunction.FunctionARN }]
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiNoCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref PortalResponseHeadersPolicy
  PublicWebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PublicWebBucket
      PolicyDocument: { Version: '2012-10-17', Statement: [{ Sid: DenyInsecureTransport, Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt PublicWebBucket.Arn, !Sub '${PublicWebBucket.Arn}/*'], Condition: { Bool: { 'aws:SecureTransport': 'false', 'aws:PrincipalIsAWSService': 'false' } } }, { Effect: Allow, Principal: { Service: cloudfront.amazonaws.com }, Action: s3:GetObject, Resource: !Sub '${PublicWebBucket.Arn}/*', Condition: { StringEquals: { 'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PublicDistribution}' } } }] }
  CustomerWebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CustomerWebBucket
      PolicyDocument: { Version: '2012-10-17', Statement: [{ Sid: DenyInsecureTransport, Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt CustomerWebBucket.Arn, !Sub '${CustomerWebBucket.Arn}/*'], Condition: { Bool: { 'aws:SecureTransport': 'false', 'aws:PrincipalIsAWSService': 'false' } } }, { Effect: Allow, Principal: { Service: cloudfront.amazonaws.com }, Action: s3:GetObject, Resource: !Sub '${CustomerWebBucket.Arn}/*', Condition: { StringEquals: { 'AWS:SourceArn': [!Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PublicDistribution}', !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CustomerDistribution}'] } } }] }
  StewardWebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StewardWebBucket
      PolicyDocument: { Version: '2012-10-17', Statement: [{ Sid: DenyInsecureTransport, Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt StewardWebBucket.Arn, !Sub '${StewardWebBucket.Arn}/*'], Condition: { Bool: { 'aws:SecureTransport': 'false', 'aws:PrincipalIsAWSService': 'false' } } }, { Effect: Allow, Principal: { Service: cloudfront.amazonaws.com }, Action: s3:GetObject, Resource: !Sub '${StewardWebBucket.Arn}/*', Condition: { StringEquals: { 'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${StewardDistribution}' } } }] }

  PublicDnsA:
    Type: AWS::Route53::RecordSet
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Ref PublicDomainName, Type: A, AliasTarget: { DNSName: !GetAtt PublicDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
  PublicDnsAaaa:
    Type: AWS::Route53::RecordSet
    Condition: EnableViewerIpv6
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Ref PublicDomainName, Type: AAAA, AliasTarget: { DNSName: !GetAtt PublicDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
  CustomerDnsA:
    Type: AWS::Route53::RecordSet
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Ref CustomerDomainName, Type: A, AliasTarget: { DNSName: !GetAtt CustomerDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
  CustomerDnsAaaa:
    Type: AWS::Route53::RecordSet
    Condition: EnableViewerIpv6
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Ref CustomerDomainName, Type: AAAA, AliasTarget: { DNSName: !GetAtt CustomerDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
  CustomerCognitoDnsA:
    Type: AWS::Route53::RecordSet
    Condition: UseCustomerCustomDomain
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Ref CustomerCognitoCustomDomain, Type: A, AliasTarget: { DNSName: !GetAtt CustomerUserPoolCustomDomain.CloudFrontDistribution, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false } }
  CustomerCognitoDnsAaaa:
    Type: AWS::Route53::RecordSet
    Condition: UseCustomerCustomDomainWithIpv6
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Ref CustomerCognitoCustomDomain, Type: AAAA, AliasTarget: { DNSName: !GetAtt CustomerUserPoolCustomDomain.CloudFrontDistribution, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false } }
  StewardDnsA:
    Type: AWS::Route53::RecordSet
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Ref StewardDomainName, Type: A, AliasTarget: { DNSName: !GetAtt StewardDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
  StewardDnsAaaa:
    Type: AWS::Route53::RecordSet
    Condition: EnableViewerIpv6
    Properties: { HostedZoneId: !Ref HostedZoneId, Name: !Ref StewardDomainName, Type: AAAA, AliasTarget: { DNSName: !GetAtt StewardDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }

  OpsTopic:
    Type: AWS::SNS::Topic
    Properties: { KmsMasterKeyId: !GetAtt DataKey.Arn, Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: OpsTopic }, { Key: Owner, Value: !Ref ResourceOwner }] }
  OpsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OpsTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref OpsTopic
          - Sid: CloudWatchAlarmPublish
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref OpsTopic
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*' }
          - Sid: SesFeedbackPublish
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref OpsTopic
            Condition:
              StringEquals: { 'AWS:SourceAccount': !Ref 'AWS::AccountId' }
              ArnLike: { 'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/webwatch-${Stage}-transactional' }
  SesFeedbackEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DependsOn: OpsTopicPolicy
    Properties:
      ConfigurationSetName: !Ref SesConfigurationSet
      EventDestination:
        Name: operational-failures
        Enabled: true
        MatchingEventTypes: [bounce, complaint, deliveryDelay, reject, renderingFailure]
        SnsDestination: { TopicARN: !Ref OpsTopic }
  OpsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: EnableOpsSubscription
    Properties: { TopicArn: !Ref OpsTopic, Protocol: email, Endpoint: !If [HasOpsAlertEmail, !Ref OpsAlertEmail, !Ref TechnicalAlertEmail] }
  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: API Lambda errors, Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 2, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ApiErrorAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  DispatcherHeartbeatMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatcherLogGroup
      FilterPattern: '"dispatcher.completed"'
      MetricTransformations: [{ MetricNamespace: !Sub 'WebWatch/${Stage}', MetricName: DispatcherCompleted, MetricValue: '1', DefaultValue: 0, Unit: Count }]
  DispatcherHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: DispatcherHeartbeatAlarm }, { Key: Owner, Value: !Ref ResourceOwner }]
      AlarmDescription: Dispatcher positive heartbeat is missing for two five-minute periods; quiet ticks must still log success.
      Namespace: !Sub 'WebWatch/${Stage}'
      MetricName: DispatcherCompleted
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OpsTopic]
  MaintenanceHeartbeatMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BillingLogGroup
      FilterPattern: '"maintenance.healthy"'
      MetricTransformations: [{ MetricNamespace: !Sub 'WebWatch/${Stage}', MetricName: MaintenanceCompleted, MetricValue: '1', DefaultValue: 0, Unit: Count }]
  MaintenanceHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: MaintenanceHeartbeatAlarm }, { Key: Owner, Value: !Ref ResourceOwner }]
      AlarmDescription: Maintenance positive heartbeat is missing for two five-minute periods; this can indicate a stalled queue or caught task failures.
      Namespace: !Sub 'WebWatch/${Stage}'
      MetricName: MaintenanceCompleted
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OpsTopic]
  MaintenanceTaskFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref BillingLogGroup
      FilterPattern: '"maintenance.task.failed"'
      MetricTransformations: [{ MetricNamespace: !Sub 'WebWatch/${Stage}', MetricName: MaintenanceTaskFailures, MetricValue: '1', DefaultValue: 0, Unit: Count }]
  MaintenanceTaskFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: An independently claimed maintenance task failed; a successful invocation alone is not proof of maintenance success, Namespace: !Sub 'WebWatch/${Stage}', MetricName: MaintenanceTaskFailures, Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 0, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: MaintenanceTaskFailureAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  PrimaryCaptureErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Primary browser invocation errors, Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref CaptureFunction }], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 0, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: PrimaryCaptureErrorAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  PrimaryCaptureThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Primary browser invocations are throttled, Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{ Name: FunctionName, Value: !Ref CaptureFunction }], Statistic: Sum, Period: 300, EvaluationPeriods: 2, Threshold: 0, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: PrimaryCaptureThrottleAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  PrimaryCaptureQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Primary capture queue age is approaching the 900-second run deadline; platform delay is not a monitored-site outage, Namespace: AWS/SQS, MetricName: ApproximateAgeOfOldestMessage, Dimensions: [{ Name: QueueName, Value: !GetAtt CaptureQueue.QueueName }], Statistic: Maximum, Period: 60, EvaluationPeriods: 3, Threshold: 300, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: PrimaryCaptureQueueAgeAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Worker Lambda errors, Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref WorkerFunction }], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: WorkerErrorAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  CaptureIncompleteRunMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      # Lambda prefixes text console JSON; phrase matching works for both the
      # current text format and a future JSON logging configuration.
      FilterPattern: '"capture.run.incomplete"'
      MetricTransformations:
        - MetricNamespace: !Sub 'WebWatch/${Stage}'
          MetricName: CaptureIncompleteRuns
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count
  CaptureIncompleteMaintenanceMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      # Deadline synthesis runs in BillingFunction's maintenance consumer. Both
      # log groups feed the same metric and alarm, without a second metric series.
      LogGroupName: !Ref BillingLogGroup
      FilterPattern: '"capture.run.incomplete"'
      MetricTransformations:
        - MetricNamespace: !Sub 'WebWatch/${Stage}'
          MetricName: CaptureIncompleteRuns
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count
  CaptureIncompleteRunAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureIncompleteRunAlarm }, { Key: Owner, Value: !Ref ResourceOwner }]
      AlarmDescription: A committed watcher run has an internal capture failure, an unavailable selected Region, or an unavailable required comparison; target-site outages alone do not trigger this alarm.
      Namespace: !Sub 'WebWatch/${Stage}'
      MetricName: CaptureIncompleteRuns
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
  BillingErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Billing Lambda errors, Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref BillingFunction }], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: BillingErrorAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  ReportErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Report Lambda errors, Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref ReportFunction }], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ReportErrorAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  CheckDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Check DLQ contains messages, Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{ Name: QueueName, Value: !GetAtt CheckDeadLetterQueue.QueueName }], Statistic: Maximum, Period: 300, EvaluationPeriods: 1, Threshold: 0, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CheckDlqAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  CaptureDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Regional capture DLQ contains messages, Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{ Name: QueueName, Value: !GetAtt CaptureDeadLetterQueue.QueueName }], Statistic: Maximum, Period: 300, EvaluationPeriods: 1, Threshold: 0, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureDlqAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  CaptureResultDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Regional capture result DLQ contains messages, Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{ Name: QueueName, Value: !GetAtt CaptureResultDeadLetterQueue.QueueName }], Statistic: Maximum, Period: 300, EvaluationPeriods: 1, Threshold: 0, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureResultDlqAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  BillingDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Billing/maintenance DLQ contains messages, Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{ Name: QueueName, Value: !GetAtt BillingDeadLetterQueue.QueueName }], Statistic: Maximum, Period: 300, EvaluationPeriods: 1, Threshold: 0, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: BillingDlqAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  ReportDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { AlarmDescription: Report DLQ contains messages, Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{ Name: QueueName, Value: !GetAtt ReportDeadLetterQueue.QueueName }], Statistic: Maximum, Period: 300, EvaluationPeriods: 1, Threshold: 0, ComparisonOperator: GreaterThanThreshold, TreatMissingData: notBreaching, AlarmActions: [!Ref OpsTopic], Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: ReportDlqAlarm }, { Key: Owner, Value: !Ref ResourceOwner }] }
  MonthlyBudgetWithAlerts:
    Type: AWS::Budgets::Budget
    Condition: EnableTechnicalAlerts
    Properties:
      # Keep the legacy physical name: its Stage label is NOT a cost filter.
      # Explicit legacy defaults preserve the existing unblended all-charge basis.
      Budget:
        BudgetName: !Sub 'WebWatch-${Stage}-monthly'
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
        BudgetType: COST
        TimeUnit: MONTHLY
        CostTypes: { IncludeCredit: true, IncludeDiscount: true, IncludeOtherSubscription: true, IncludeRecurring: true, IncludeRefund: true, IncludeSubscription: true, IncludeSupport: true, IncludeTax: true, IncludeUpfront: true, UseAmortized: false, UseBlended: false }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !If [HasBudgetAlertEmail, !Ref BudgetAlertEmail, !Ref TechnicalAlertEmail] }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !If [HasBudgetAlertEmail, !Ref BudgetAlertEmail, !Ref TechnicalAlertEmail] }]
  MonthlyBudgetWithoutAlerts:
    Type: AWS::Budgets::Budget
    Condition: DisableTechnicalAlerts
    Properties:
      Budget:
        BudgetName: !Sub 'WebWatch-${Stage}-monthly'
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
        BudgetType: COST
        TimeUnit: MONTHLY
        CostTypes: { IncludeCredit: true, IncludeDiscount: true, IncludeOtherSubscription: true, IncludeRecurring: true, IncludeRefund: true, IncludeSubscription: true, IncludeSupport: true, IncludeTax: true, IncludeUpfront: true, UseAmortized: false, UseBlended: false }
      # Preserve the existing logical ID when adding an independent destination
      # to a staging stack that intentionally has technical alerts disabled.
      NotificationsWithSubscribers: !If
        - HasBudgetAlertEmail
        - - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
            Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetAlertEmail }]
          - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
            Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetAlertEmail }]
        - !Ref 'AWS::NoValue'
  ScopedMonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateScopedBudget
    Properties:
      Budget:
        BudgetName: !Sub 'WebWatch-${Stage}-tagged-monthly'
        BudgetLimit: { Amount: !Ref ScopedMonthlyBudgetUsd, Unit: USD }
        BudgetType: COST
        TimeUnit: MONTHLY
        Metrics: [UnblendedCost]
        FilterExpression:
          And:
            - Tags: { Key: 'user:Application', Values: [WebWatch] }
            - Tags: { Key: 'user:Stage', Values: [!Ref Stage] }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetAlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetAlertEmail }]

  SnapshotBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SnapshotBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Sid: DenyInsecureTransport, Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt SnapshotBucket.Arn, !Sub '${SnapshotBucket.Arn}/*'], Condition: { Bool: { 'aws:SecureTransport': 'false', 'aws:PrincipalIsAWSService': 'false' } } }
  QueueTransportPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref CheckQueue, !Ref CheckDeadLetterQueue, !Ref CaptureQueue, !Ref CaptureDeadLetterQueue, !Ref CaptureResultQueue, !Ref CaptureResultDeadLetterQueue, !Ref BillingQueue, !Ref BillingDeadLetterQueue, !Ref ReportQueue, !Ref ReportDeadLetterQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 'sqs:*'
            # A shared SQS policy needs a single Resource per statement.
            # This Deny applies only to queues in the Queues attachment list.
            Resource: '*'
            Condition: { Bool: { 'aws:SecureTransport': 'false', 'aws:PrincipalIsAWSService': 'false' } }

  CheckQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scheduled watcher admission is delayed
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{ Name: QueueName, Value: !GetAtt CheckQueue.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 120
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CheckQueueAgeAlarm }, { Key: Owner, Value: !Ref ResourceOwner }]
  CaptureResultQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Completed captures are waiting for settlement
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{ Name: QueueName, Value: !GetAtt CaptureResultQueue.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 120
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
      Tags: [{ Key: Application, Value: WebWatch }, { Key: Stage, Value: !Ref Stage }, { Key: Component, Value: CaptureResultQueueAgeAlarm }, { Key: Owner, Value: !Ref ResourceOwner }]

Outputs:
  ApiUrl: { Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}' }
